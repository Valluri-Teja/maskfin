name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies (Tesseract OCR, poppler)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr poppler-utils

      - name: Install Python test dependencies
        run: |
          pip install pytest reportlab pytesseract pdf2image img2pdf Pillow

      - name: Run unit tests
        run: |
          pytest tests/ -v

      - name: Run detector accuracy eval
        run: |
          python eval_accuracy.py

      - name: Upload eval results as a build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval_results.json
